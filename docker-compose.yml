# AList Watchparty — Compose deployment using a PRE-BUILT image.
#
#   cp .env.example .env
#   # set IMAGE to your published image, e.g.
#   #   IMAGE=ghcr.io/<your-github-user>/alist-watchparty:latest
#   docker compose up -d
#
# The GitHub Actions workflow in .github/workflows/docker.yml builds and
# publishes that image to GitHub Container Registry on every push to main.
#
# Local build instead of pulling:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
name: alist-watchparty

services:
  alist-watchparty:
    # Pre-built image. No `build:` here on purpose: deployments should pull the
    # same bytes that CI built. Use docker-compose.build.yml for a local build.
    image: ${IMAGE:-ghcr.io/your-github-user/alist-watchparty:latest}
    pull_policy: always
    container_name: alist-watchparty
    restart: unless-stopped

    ports:
      - "${HOST_PORT:-8364}:8364"

    # Every setting lives in .env; see .env.example for AList / OpenList /
    # 小雅 alist / direct-link options.
    env_file:
      - .env
    environment:
      # The container's internal port is fixed; publish with HOST_PORT.
      PORT: "8364"
      HOST: "0.0.0.0"

    # AList/OpenList on the Docker host (Linux): uncomment this so the container
    # can reach the host by name instead of an IP that changes.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    # If AList is another Compose service, attach both to the same network
    # and set ALIST_URL=http://alist:5244 instead.
    # networks:
    #   - media

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8364/api/health || exit 1"]
      interval: 60s
      timeout: 3s
      start_period: 5s
      retries: 3

    init: true
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# networks:
#   media:
